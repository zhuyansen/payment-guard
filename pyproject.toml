[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-guard"
version = "0.3.1"
description = "Pick a payment platform you can open (Creem, Dodo, Waffo, Paddle, Lemon Squeezy, Polar, Stripe, Gumroad) and check your website against its published review requirements"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Zhu" }]
keywords = ["payments", "merchant-of-record", "stripe", "paddle", "lemon-squeezy", "creem", "saas", "agent-skills"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

[project.urls]
Homepage = "https://github.com/zhuyansen/payment-guard"
Changelog = "https://github.com/zhuyansen/payment-guard/releases"
Issues = "https://github.com/zhuyansen/payment-guard/issues"

[project.scripts]
payment-guard = "payment_guard.__main__:main"

[tool.setuptools]
packages = ["payment_guard"]

[tool.setuptools.package-data]
payment_guard = ["data/*.json"]
